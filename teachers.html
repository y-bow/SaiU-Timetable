    <script>
        // Apply saved theme (background + accent) before first paint so there is
        // no flash of the default dark theme for returning users. Shared with
        // index.html — disappears on the same localStorage key "tt-theme".
        (function () {
            try {
                var KEY = 'tt-theme';
                var BGS = ['dark', 'light', 'warm', 'cool'];
                var LEGACY = { red: '#d85757', blue: '#3b6fe0', purple: '#7c5cfc', green: '#0b8a5f', orange: '#ea7a12', teal: '#0f7a75' };
                var HEX = /^#[0-9a-f]{6}$/i;
                var BASES = { dark: '#000000', light: '#F3F4F6', warm: '#171310', cool: '#171E29' };
                function mix(a, b, w) {
                    function p(h) { h = h.replace('#', ''); return [h.slice(0, 2), h.slice(2, 4), h.slice(4, 6)].map(function (s) { return parseInt(s, 16); }); }
                    var A = p(a), B = p(b);
                    return '#' + A.map(function (v, i) { return Math.round(v + (B[i] - v) * w).toString(16).padStart(2, '0'); }).join('');
                }
                var saved = null;
                try { saved = localStorage.getItem(KEY); } catch (_) {}
                var bg = 'dark', accent = '#d85757', bgColor = '';
                if (saved) {
                    var t = JSON.parse(saved);
                    if (t && typeof t === 'object') {
                        if (BGS.indexOf(t.background) !== -1) bg = t.background;
                        if (HEX.test(t.accent)) accent = t.accent;
                        else if (LEGACY[t.accent]) accent = LEGACY[t.accent];
                        if (HEX.test(t.bgColor)) bgColor = t.bgColor;
                    }
                }
                var tint = bgColor || BASES[bg];
                var doc = document.documentElement;
                doc.setAttribute('data-bg', bg);
                doc.setAttribute('data-accent', accent);
                doc.setAttribute('data-bg-color', tint);
                doc.style.setProperty('--bg-tint', tint);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', mix(BASES[bg], tint, 0.12));
            } catch (_) {}
        })();
    </script>

    <style>
        /* ---------- Critical CSS ----------
           Inlined deliberately. This is the only styling that is guaranteed to
           be applied at the very first paint, which is what lets the browser
           hand off from the OS splash screen without a white flash.

           --bg-tint was just set inline by the theme script above, so these
           rules already reflect the user's saved theme (dark / light / warm /
           cool) before any stylesheet request is made.

           Everything here must stay in sync with the real rules in the
           stylesheet: html -> background: var(--bg), body -> background,
           font-family, color. */
        html { background: var(--bg-tint, #000); }
        body {
            margin: 0;
            background: var(--bg-tint, #000);
            color: #EDEDED;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            overflow-x: clip;
            -webkit-font-smoothing: antialiased;
        }
        /* Reserve the scrollbar gutter so late-loading content never shifts the
           layout sideways. */
        html { scrollbar-gutter: stable; }

        /* ---------- Boot layer ----------
           Painted by the first frame, before any stylesheet or module has
           loaded. It exists so the transition from the OS splash screen to the
           app is a continuous themed surface instead of black -> white ->
           black -> spinner. Styled here rather than in the stylesheet precisely
           because it must not depend on a network round trip.

           Removed by the app on the first successful render, with a timeout and
           an error handler as failsafes so it can never trap the user on a
           blank screen. */
        #boot {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: var(--bg-tint, #000);
            /* Fade rather than vanish, so the hand-off reads as a cross-fade.
               `boot-hidden` (display:none) is applied afterwards to stop it
               eating taps on the UI underneath. */
            transition: opacity 180ms ease-out;
        }
        #boot.boot-done { opacity: 0; pointer-events: none; }
        #boot.boot-hidden { display: none; }
        #boot .boot-logo {
            width: 76px;
            height: 76px;
            object-fit: contain;
            /* The vendored mark is white; on the light theme it must invert to
               black so it stays visible on a near-white canvas. */
        }
        html[data-bg="light"] #boot .boot-logo { filter: invert(1); }
        #boot .boot-word {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #8A8A8E;
        }
        #boot .boot-ring {
            width: 22px; height: 22px;
            margin-top: 6px;
            border: 2px solid rgba(255, 255, 255, 0.16);
            border-top-color: #d85757;
            border-radius: 50%;
            animation: boot-spin 0.7s linear infinite;
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            #boot .boot-ring { animation-duration: 2.4s; }
            #boot { transition: none; }
        }
    </style>

<body class="teacher-page">

    <!-- Boot layer. Pure HTML + inline critical CSS, so it is on screen at the
         very first paint and turns the OS splash -> app hand-off into a
         cross-fade on one themed surface instead of black -> white -> black ->
         spinner. Removed by the app on the first successful render; a timeout
         and an error handler act as failsafes. Duplicated in index.html. -->
    <div id="boot" role="status" aria-live="polite">
        <img class="boot-logo" src="icons/app/white-icon-512.png?v=2026-10-07-001" alt="" aria-hidden="true" width="76" height="76" decoding="async">
        <span class="boot-word">Teacher Timetable</span>
        <span class="boot-ring" aria-hidden="true"></span>
    </div>


    <header class="teacher-topbar">
        <h1 class="teacher-title">
            <img class="brand-logo" src="icons/favicon/favicon-48.png?v=2026-10-07-001" alt="" aria-hidden="true" width="48" height="48" decoding="async">
            Teacher Timetable
        </h1>
        <div class="teacher-topbar-actions">
            <span id="teacher-updated" class="teacher-updated"></span>
            <button id="teacher-refresh" class="icon-btn" type="button" aria-label="Refresh">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
            </button>
        </div>
    </header>

    <main class="teacher-main">
        <section class="teacher-picker" aria-label="Teacher picker">
            <div class="teacher-search-wrap">
                <input id="teacher-search" type="search" autocomplete="off"
                       placeholder="Type a teacher name…" aria-label="Search teachers">
                <span id="teacher-count" class="teacher-count"></span>
            </div>
            <ul id="teacher-list" class="teacher-list" role="listbox" aria-label="Teachers"></ul>
        </section>

        <section class="teacher-content" aria-label="Teacher timetable">
            <div id="pull-indicator" class="pull-indicator" aria-hidden="true">
                <span class="spinner"></span>
                <span>Release to refresh</span>
            </div>
            <div id="teacher-debug" class="teacher-debug hidden" aria-live="polite"></div>

            <div class="teacher-context">
                <h2 id="teacher-name" class="teacher-name">–</h2>
                <span id="teacher-summary" class="teacher-summary"></span>
            </div>

            <nav id="days-filter" class="days-filter" role="radiogroup" aria-label="Select day"></nav>

            <div class="main-header">
                <h3 id="timeline-title" class="main-title"></h3>
                <span id="timeline-stats" class="main-stats"></span>
            </div>

            <div id="loading-state" class="loading-state" role="status" aria-live="polite">
                <div class="loading-spinner" aria-hidden="true"></div>
                <span>Loading teacher timetable…</span>
            </div>

            <ol id="timeline" class="timeline"></ol>

            <div id="teacher-empty" class="state-card hidden">
                <h3 id="state-title">No teachers found</h3>
                <p id="state-message">No teacher timetable could be built from the source sheets.</p>
                <button id="teacher-retry" class="retry-btn btn primary hidden" type="button">Try again</button>
            </div>
        </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="js/teachers/teacher-app.js?v=2026-10-07-001"></script>
</body>
