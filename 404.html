    <style>
        /* Base page layout */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .error-header h1 {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 4px;
            background: linear-gradient(180deg, var(--text) 30%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.04em;
            font-optical-sizing: auto;
        }

        .error-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .game-desc {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .game-cta-text {
            color: var(--text-tertiary);
            font-size: 0.82rem;
            margin: 8px auto 6px;
        }

        /* Game area — translucent material */
        .game-wrapper {
            position: relative;
            width: 100%;
            background: rgba(17, 17, 17, 0.72);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            padding: 0 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .game-header span {
            font-variant-numeric: tabular-nums;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 600 / 400;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            touch-action: none; /* Prevent touch gestures on mobile */
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 13, 13, 0.85);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(4px);
            z-index: 10;
            transition: opacity 0.25s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .overlay-title.gameover {
            color: var(--primary);
        }

        /* Actions/buttons */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background var(--fast), border-color var(--fast), filter var(--fast), transform 100ms ease-out;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn:active { transform: scale(0.97); }

        .btn-outline {
            background: transparent;
            border-color: var(--border-strong);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--text-secondary);
            color: var(--text);
            background: var(--surface-2);
        }

        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Game info footer */
        .controls-info {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            line-height: 1.4;
            max-width: 400px;
            margin: 8px auto 0;
        }

        .controls-info kbd {
            background: var(--surface-3);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xs);
            padding: 2px 5px;
            font-family: inherit;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="error-header">
            <h1>404</h1>
            <p>Page not found.</p>
        </header>

        <p class="game-desc">While you're here, play a game of Breakout.</p>

        <div class="game-wrapper">
            <div class="game-header">
                <div id="score-display">SCORE: <span>0000</span></div>
                <div id="high-score-display">BEST: <span>0000</span></div>
                <div id="level-display">LEVEL: <span>1</span></div>
                <div id="lives-display">LIVES: <span>3</span></div>
            </div>

            <canvas id="game-canvas"></canvas>

            <!-- Screen overlays -->
            <div id="start-overlay" class="overlay">
                <div class="overlay-title">BREAKOUT</div>
                <button id="start-button" class="btn primary">Start Game [Space]</button>
            </div>

            <div id="gameover-overlay" class="overlay hidden">
                <div class="overlay-title gameover">GAME OVER</div>
                <button id="restart-button" class="btn primary">Restart [Space]</button>
            </div>
        </div>

        <div id="game-context" class="game-context hidden"></div>

        <div class="actions">
            <button id="reset-game-btn" class="btn btn-outline">Reset Game</button>
            <a href="index.html" class="btn btn-outline">Back to timetable</a>
        </div>

        <div class="controls-info">
            Move paddle: <kbd>A</kbd> / <kbd>D</kbd> or <kbd>←</kbd> / <kbd>→</kbd><br>
            Touch & drag on mobile to steer paddle.
        </div>
    </div>

    <script src="js/game/breakout.js?v=2026-09-04-004"></script>

    <!-- Background timetable sync: never blocks the game. The game above
         boots immediately; this module only refreshes the shared timetable
         cache when the network is available. -->
    <script type="module" src="js/services/timetable-sync.js?v=2026-09-04-004"></script>
</body>
</html>
