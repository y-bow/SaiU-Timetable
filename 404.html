<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - Page Not Found | SaiU Timetable</title>
    <meta name="description" content="The page you are looking for does not exist. Play a classic game of Breakout while you're here.">
    <meta name="theme-color" content="#0D0D0D">
    <link rel="stylesheet" href="style.css?v=2026-08-08-027">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/white/favicon-32.png?v=2026-08-08-027">
    
    <style>
        /* Base page layout */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .error-header h1 {
            font-size: 4rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 4px;
            background: linear-gradient(180deg, var(--text) 30%, var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.04em;
        }

        .error-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .game-desc {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        /* Game area */
        .game-wrapper {
            position: relative;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        .game-header span {
            font-variant-numeric: tabular-nums;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 600 / 400;
            background: var(--surface-2);
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            touch-action: none; /* Prevent touch gestures on mobile */
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(13, 13, 13, 0.85);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(4px);
            z-index: 10;
            transition: opacity 0.25s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 16px;
        }

        .overlay-title.gameover {
            color: var(--primary);
        }

        /* Actions/buttons */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background var(--fast), border-color var(--fast), filter var(--fast);
            border: 1px solid transparent;
            cursor: pointer;
        }

        .btn-outline {
            background: transparent;
            border-color: var(--border-strong);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--text-secondary);
            color: var(--text);
            background: var(--surface-2);
        }

        .btn:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Game info footer */
        .controls-info {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            line-height: 1.4;
            max-width: 400px;
            margin: 8px auto 0;
        }

        .controls-info kbd {
            background: var(--surface-3);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-xs);
            padding: 2px 5px;
            font-family: inherit;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="error-header">
            <h1>404</h1>
            <p>Page not found.</p>
        </header>

        <p class="game-desc">While you're here, play a game of Breakout.</p>

        <div class="game-wrapper">
            <div class="game-header">
                <div id="score-display">SCORE: <span>0000</span></div>
                <div id="level-display">LEVEL: <span>1</span></div>
                <div id="lives-display">LIVES: <span>3</span></div>
            </div>

            <canvas id="game-canvas"></canvas>

            <!-- Screen overlays -->
            <div id="start-overlay" class="overlay">
                <div class="overlay-title">BREAKOUT</div>
                <button id="start-button" class="btn primary">Start Game</button>
            </div>

            <div id="gameover-overlay" class="overlay hidden">
                <div class="overlay-title gameover">GAME OVER</div>
                <button id="restart-button" class="btn primary">Restart</button>
            </div>
        </div>

        <div class="actions">
            <button id="reset-game-btn" class="btn btn-outline">Reset Game</button>
            <a href="index.html" class="btn btn-outline">Back to timetable</a>
        </div>

        <div class="controls-info">
            Move paddle: <kbd>A</kbd> / <kbd>D</kbd> or <kbd>←</kbd> / <kbd>→</kbd><br>
            Touch & drag or move mouse inside game area to steer paddle.<br>
            Catch <strong style="color: var(--primary);">M</strong> power-ups to split the ball into Multiballs!
        </div>
    </div>

    <script>
        // --- Game constants ---
        const LOGICAL_WIDTH = 600;
        const LOGICAL_HEIGHT = 400;
        const BRICK_ROWS = 5;
        const BRICK_COLS = 8;
        const BALL_SPEED_START = 280; // px per second
        const BALL_SPEED_MAX = 450;
        const PADDLE_SPEED = 450; // px per second
        const PADDLE_WIDTH = 90;
        const PADDLE_HEIGHT = 12;
        const PADDLE_MARGIN = 10; // Keep rounded edges completely inside canvas borders

        // --- DOM Elements ---
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreVal = document.querySelector('#score-display span');
        const levelVal = document.querySelector('#level-display span');
        const livesVal = document.querySelector('#lives-display span');
        
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        
        const startBtn = document.getElementById('start-button');
        const restartBtn = document.getElementById('restart-button');
        const resetGameBtn = document.getElementById('reset-game-btn');

        // --- Game State ---
        let score = 0;
        let level = 1;
        let lives = 3;
        let state = 'start'; // 'start' | 'playing' | 'gameover'
        let animationFrameId = null;
        let lastTime = 0;

        // Level Transition Notification
        let levelUpTimer = 0; // Display level up text for 2 seconds

        // Keyboard tracking
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            a: false,
            d: false,
            A: false,
            D: false
        };

        // Entities
        const paddle = {
            x: (LOGICAL_WIDTH - PADDLE_WIDTH) / 2,
            y: LOGICAL_HEIGHT - 30,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT
        };

        // Dynamic entities arrays
        let balls = [];
        let powerups = [];
        let particles = [];
        let bricks = [];

        // Colors matching SaiU Timetable styling tokens
        const colors = {
            bg: '#18181B', // Canvas background (var(--surface-2))
            border: '#262626',
            paddle: '#E86868', // Primary accent (var(--primary-hover))
            ball: '#F5F5F5',
            // Colors of rows from top to bottom
            bricks: [
                '#d85757', // Row 0: Primary (coral/red)
                '#F5F5F5', // Row 1: white text color
                '#A1A1AA', // Row 2: text-secondary
                '#333333', // Row 3: border-strong
                '#262626'  // Row 4: border
            ]
        };

        // --- Setup & Listeners ---
        function initListeners() {
            window.addEventListener('resize', handleResize);
            
            // Keyboard controls
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);

            // Pointer (Mouse / Touch) controls
            canvas.addEventListener('pointermove', handlePointerMove);
            canvas.addEventListener('pointerdown', handlePointerDown);

            // Button clicks
            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', resetGame);
            resetGameBtn.addEventListener('click', resetGame);

            // Visibility API: pause/stop loop if page is hidden
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    if (animationFrameId) {
                        cancelAnimationFrame(animationFrameId);
                        animationFrameId = null;
                    }
                } else if (state === 'playing') {
                    lastTime = performance.now();
                    animationFrameId = requestAnimationFrame(gameLoop);
                }
            });
        }

        function handleResize() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            draw();
        }

        function handleKeyDown(e) {
            if (e.key in keys) {
                keys[e.key] = true;
                e.preventDefault();
            }
            // Launch ball with space if attached to paddle
            if (e.key === ' ' || e.key === 'Spacebar') {
                launchBall();
                e.preventDefault();
            }
        }

        function handleKeyUp(e) {
            if (e.key in keys) {
                keys[e.key] = false;
                e.preventDefault();
            }
        }

        function getCanvasRelativeX(clientX) {
            const rect = canvas.getBoundingClientRect();
            // Scale clientX to our logical width coordinate system
            return ((clientX - rect.left) / rect.width) * LOGICAL_WIDTH;
        }

        function handlePointerMove(e) {
            if (state !== 'playing') return;
            const x = getCanvasRelativeX(e.clientX);
            // Center the paddle on the pointer, clamped cleanly within insets
            paddle.x = Math.max(PADDLE_MARGIN, Math.min(LOGICAL_WIDTH - paddle.width - PADDLE_MARGIN, x - paddle.width / 2));
            
            balls.forEach(ball => {
                if (ball.attachedToPaddle) {
                    ball.x = paddle.x + paddle.width / 2;
                }
            });
        }

        function handlePointerDown(e) {
            if (state !== 'playing') return;
            launchBall();
        }

        // --- Game Logic ---
        function resetGame() {
            score = 0;
            level = 1;
            lives = 3;
            levelUpTimer = 0;
            updateStatsUI();

            // Clear overlays
            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');

            generateBricks();
            resetBall();
            powerups = [];
            particles = [];
            state = 'playing';
            
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            lastTime = performance.now();
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function generateBricks() {
            bricks = [];
            const paddingLeftRight = 20;
            const paddingTop = 25;
            const gap = 6;
            const totalWidth = LOGICAL_WIDTH - paddingLeftRight * 2;
            const brickWidth = (totalWidth - (BRICK_COLS - 1) * gap) / BRICK_COLS;
            const brickHeight = 14;

            for (let r = 0; r < BRICK_ROWS; r++) {
                for (let c = 0; c < BRICK_COLS; c++) {
                    // 15% chance of being a Multiball special block
                    const isSpecial = Math.random() < 0.20;
                    bricks.push({
                        x: paddingLeftRight + c * (brickWidth + gap),
                        y: paddingTop + r * (brickHeight + gap),
                        width: brickWidth,
                        height: brickHeight,
                        color: colors.bricks[r],
                        active: true,
                        type: isSpecial ? 'multiball' : 'normal'
                    });
                }
            }
        }

        function startGame() {
            resetGame();
        }

        function resetBall() {
            balls = [{
                x: paddle.x + paddle.width / 2,
                y: paddle.y - 7,
                vx: 0,
                vy: 0,
                radius: 7,
                attachedToPaddle: true
            }];

            // Start automatically after a brief delay
            setTimeout(() => {
                if (state === 'playing') {
                    launchBall();
                }
            }, 1200);
        }

        function launchBall() {
            balls.forEach(ball => {
                if (ball.attachedToPaddle) {
                    ball.attachedToPaddle = false;
                    const angle = -Math.PI / 4 - Math.random() * (Math.PI / 2);
                    // Speed multiplier increases with level
                    const speed = BALL_SPEED_START * (1 + (level - 1) * 0.08);
                    ball.vx = Math.cos(angle) * speed;
                    ball.vy = Math.sin(angle) * speed;
                }
            });
        }

        function spawnParticles(x, y, color) {
            const count = 10;
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 40 + Math.random() * 80;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    radius: 2 + Math.random() * 2,
                    alpha: 1.0,
                    decay: 1.8 + Math.random() * 1.2,
                    color: color
                });
            }
        }

        function spawnPowerup(x, y) {
            powerups.push({
                x: x,
                y: y,
                vy: 110, // px per second
                width: 14,
                height: 14,
                letter: 'M',
                color: '#d85757'
            });
        }

        function updateStatsUI() {
            scoreVal.textContent = String(score).padStart(4, '0');
            levelVal.textContent = String(level);
            livesVal.textContent = String(lives);
        }

        function gameLoop(currentTime) {
            if (state !== 'playing') {
                animationFrameId = null;
                return;
            }

            // Delta time in seconds
            let dt = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            // Clamp delta time to avoid huge leaps
            if (dt > 0.05) dt = 0.05;

            updatePhysics(dt);
            draw();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function updatePhysics(dt) {
            // 1. Level-up Timer Decay
            if (levelUpTimer > 0) {
                levelUpTimer -= dt;
            }

            // 2. Move Paddle via Keyboard
            let moveDir = 0;
            if (keys.ArrowLeft || keys.a || keys.A) moveDir -= 1;
            if (keys.ArrowRight || keys.d || keys.D) moveDir += 1;

            if (moveDir !== 0) {
                paddle.x += moveDir * PADDLE_SPEED * dt;
                // Keep paddle strictly inside margins
                paddle.x = Math.max(PADDLE_MARGIN, Math.min(LOGICAL_WIDTH - paddle.width - PADDLE_MARGIN, paddle.x));
                
                balls.forEach(ball => {
                    if (ball.attachedToPaddle) {
                        ball.x = paddle.x + paddle.width / 2;
                    }
                });
            }

            // 3. Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.alpha -= p.decay * dt;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 4. Update Power-ups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pu = powerups[i];
                pu.y += pu.vy * dt;

                // Paddle collision
                if (pu.y + pu.height > paddle.y &&
                    pu.y < paddle.y + paddle.height &&
                    pu.x + pu.width > paddle.x &&
                    pu.x < paddle.x + paddle.width) {
                    
                    // Activate Multiball! Split current balls or launch extra
                    const activeBall = balls[0] || { x: paddle.x + paddle.width/2, y: paddle.y - 10, vx: 0, vy: -BALL_SPEED_START };
                    const speed = Math.hypot(activeBall.vx, activeBall.vy) || BALL_SPEED_START;
                    
                    for (let j = 0; j < 2; j++) {
                        const angle = -Math.PI/4 - Math.random() * (Math.PI/2);
                        balls.push({
                            x: activeBall.x,
                            y: activeBall.y,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            radius: 7,
                            attachedToPaddle: false
                        });
                    }

                    powerups.splice(i, 1);
                    score += 50; // Bonus score for catching powerup
                    updateStatsUI();
                    continue;
                }

                // Fall off screen
                if (pu.y > LOGICAL_HEIGHT) {
                    powerups.splice(i, 1);
                }
            }

            // 5. Update Balls
            let bricksLeft = bricks.filter(b => b.active).length;

            for (let b = balls.length - 1; b >= 0; b--) {
                const ball = balls[b];
                if (ball.attachedToPaddle) continue;

                ball.x += ball.vx * dt;
                ball.y += ball.vy * dt;

                // Left / Right Walls
                if (ball.x - ball.radius < 0) {
                    ball.x = ball.radius;
                    ball.vx = -ball.vx;
                } else if (ball.x + ball.radius > LOGICAL_WIDTH) {
                    ball.x = LOGICAL_WIDTH - ball.radius;
                    ball.vx = -ball.vx;
                }

                // Ceiling
                if (ball.y - ball.radius < 0) {
                    ball.y = ball.radius;
                    ball.vy = -ball.vy;
                }

                // Floor (Ball out of bounds)
                if (ball.y + ball.radius > LOGICAL_HEIGHT) {
                    balls.splice(b, 1);
                    continue;
                }

                // Paddle Collision
                if (ball.vy > 0 &&
                    ball.x + ball.radius > paddle.x &&
                    ball.x - ball.radius < paddle.x + paddle.width &&
                    ball.y + ball.radius > paddle.y &&
                    ball.y - ball.radius < paddle.y + paddle.height) {
                    
                    ball.y = paddle.y - ball.radius;
                    const hitPoint = ((ball.x - paddle.x) / paddle.width) * 2 - 1;
                    const maxAngle = Math.PI / 3; 
                    const angle = hitPoint * maxAngle;

                    const speedMultiplier = 1 + (level - 1) * 0.08;
                    const currentSpeed = Math.hypot(ball.vx, ball.vy);
                    const speed = Math.min(BALL_SPEED_MAX * speedMultiplier, Math.max(BALL_SPEED_START * speedMultiplier, currentSpeed * 1.02));

                    ball.vx = speed * Math.sin(angle);
                    ball.vy = -speed * Math.cos(angle);
                }

                // Bricks Collision
                for (let i = 0; i < bricks.length; i++) {
                    const brick = bricks[i];
                    if (!brick.active) continue;

                    if (ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height) {
                        
                        brick.active = false;
                        bricksLeft--;
                        score += 10;
                        updateStatsUI();

                        // Visual particles break effect
                        spawnParticles(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color);

                        // Drop power-up if special
                        if (brick.type === 'multiball') {
                            spawnPowerup(brick.x + brick.width / 2, brick.y + brick.height / 2);
                        }

                        // Bounce logic
                        const overlapX = Math.min(ball.x + ball.radius - brick.x, brick.x + brick.width - (ball.x - ball.radius));
                        const overlapY = Math.min(ball.y + ball.radius - brick.y, brick.y + brick.height - (ball.y - ball.radius));

                        if (overlapX < overlapY) {
                            ball.vx = -ball.vx;
                            ball.x += ball.vx > 0 ? overlapX : -overlapX;
                        } else {
                            ball.vy = -ball.vy;
                            ball.y += ball.vy > 0 ? overlapY : -overlapY;
                        }
                        break;
                    }
                }
            }

            // 6. Check lose/empty balls condition
            if (balls.length === 0) {
                lives--;
                updateStatsUI();
                if (lives <= 0) {
                    state = 'gameover';
                    gameoverOverlay.classList.remove('hidden');
                } else {
                    resetBall();
                }
            }

            // 7. Infinite level advancement when all bricks are cleared
            if (bricksLeft === 0) {
                level++;
                levelUpTimer = 2.0; // Show level banner for 2 seconds
                updateStatsUI();
                generateBricks();
                // Respawn ball attached to paddle cleanly
                resetBall();
                powerups = [];
            }
        }

        // --- Render functions ---
        function draw() {
            ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

            // Draw Bricks
            for (let i = 0; i < bricks.length; i++) {
                const brick = bricks[i];
                if (brick.active) {
                    ctx.fillStyle = brick.color;
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // Subtle brick outline
                    ctx.strokeStyle = colors.bg;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);

                    // If special brick, draw a indicator in the center
                    if (brick.type === 'multiball') {
                        ctx.fillStyle = '#111';
                        ctx.beginPath();
                        ctx.arc(brick.x + brick.width / 2, brick.y + brick.height / 2, 3, 0, Math.PI * 2);
                        ctx.fill();
                        
                        ctx.fillStyle = '#FFF';
                        ctx.beginPath();
                        ctx.arc(brick.x + brick.width / 2, brick.y + brick.height / 2, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            // Draw Particles
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Power-ups
            for (let i = 0; i < powerups.length; i++) {
                const pu = powerups[i];
                ctx.save();
                // Capsule outline
                ctx.fillStyle = pu.color;
                ctx.beginPath();
                ctx.roundRect(pu.x, pu.y, pu.width, pu.height, 4);
                ctx.fill();
                
                // Capsule text
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 10px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pu.letter, pu.x + pu.width / 2, pu.y + pu.height / 2);
                ctx.restore();
            }

            // Draw Fully Rounded Paddle
            ctx.fillStyle = colors.paddle;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, paddle.height / 2);
            ctx.fill();

            // Draw Balls
            balls.forEach(ball => {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = colors.ball;
                ctx.fill();
                ctx.closePath();
            });

            // Draw Level Up Banner text overlay
            if (levelUpTimer > 0) {
                ctx.save();
                ctx.fillStyle = 'rgba(13, 13, 13, 0.7)';
                ctx.fillRect(0, LOGICAL_HEIGHT / 2 - 30, LOGICAL_WIDTH, 60);

                ctx.fillStyle = colors.paddle;
                ctx.font = 'bold 24px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`LEVEL ${level}`, LOGICAL_WIDTH / 2, LOGICAL_HEIGHT / 2);
                ctx.restore();
            }
        }

        // --- Start up ---
        initListeners();
        handleResize();
    </script>
